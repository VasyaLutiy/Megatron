version: 1
System:
  name: megatron
  description: >
    PaukMegatron v1.0 — GitHub Expert Data Harvester. Collects GitHub user
    profiles and repository data, computes an expertise score, and stores
    ranked expert records in a local SQLite database. v1 is the offline core:
    parsing, async collection with an injected fetcher, scoring, storage.
  groups:
    - name: api_manager
      description: Rate-limit awareness for GitHub REST API v3 responses.
      functions:
        - name: Parse Rate Limit
          description: >
            parse_rate_limit(headers) reads GitHub X-RateLimit-* response
            headers (case-insensitive) into a Rate Limit State;
            seconds_to_wait(state, now) says how long a collector must sleep.
          behavior: >
            parse_rate_limit returns a Rate Limit State dict when the three
            headers X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset
            are present (any case), and None when any of them is missing.
            seconds_to_wait returns 0 when state is None or remaining > 0,
            otherwise max(0, reset - now).
          requirements: [Stdlib Only]
          guardrails: [Tolerant Parser]
          steps:
            - produces: Rate Limit State
          examples:
            - given: >
                the real headers of tests/fixtures/rate_limit_headers.txt
                as a dict: x-ratelimit-limit "60", x-ratelimit-remaining "59",
                x-ratelimit-reset "1790594886"
              when: parse_rate_limit is called
              then: 'the state is {"limit": 60, "remaining": 59, "reset": 1790594886}'
            - given: 'a state {"limit": 60, "remaining": 59, "reset": 1790594886}'
              when: seconds_to_wait(state, now=1790594000)
              then: the result is 0
            - given: 'a state {"limit": 60, "remaining": 0, "reset": 1790594886}'
              when: seconds_to_wait(state, now=1790594766)
              then: the result is 120
            - given: a headers dict with no X-RateLimit-* keys at all
              when: parse_rate_limit is called and seconds_to_wait(None, now=1)
              then: parse_rate_limit returns None and seconds_to_wait returns 0
              ref: Tolerant Parser
    - name: collectors
      description: Parsers for GitHub API JSON and the async profile collector.
      functions:
        - name: Parse Profile Data
          description: >
            parse_user_profile(data) turns a GitHub /users/<login> JSON dict
            into an Expert Profile; parse_repo_stats(login, repos) turns a
            /users/<login>/repos JSON list into Repo Stats.
          behavior: >
            parse_user_profile copies the Expert Profile keys from the raw
            dict (the raw GitHub keys have the same names: login, id, name,
            company, location, followers, public_repos, created_at); a
            missing optional key (name, company, location, created_at)
            becomes None, missing counters become 0. parse_repo_stats counts
            all repos in repo_count; the raw repo item keys it reads are
            exactly "fork" (bool), "stargazers_count" (int), "language"
            (string or null). Forks are excluded from non_fork_count,
            total_stars and languages; a null language is skipped.
          requirements: [Stdlib Only, Real Fixtures]
          guardrails: [Tolerant Parser]
          steps:
            - reads: GitHub User JSON
            - reads: GitHub Repos JSON
            - produces: Expert Profile
            - produces: Repo Stats
          examples:
            - given: the real file tests/fixtures/user_torvalds.json
              when: parse_user_profile is called on its parsed JSON
              then: >
                login is "torvalds", id is 1024025, followers is 325466,
                public_repos is 12, name is "Linus Torvalds"
            - given: 'a minimal dict {"login": "x", "id": 1}'
              when: parse_user_profile is called
              then: >
                followers is 0, public_repos is 0, name is None, company is
                None, location is None, created_at is None
              ref: Tolerant Parser
            - given: the real file tests/fixtures/repos_torvalds.json (12 repos)
              when: parse_repo_stats("torvalds", repos) is called
              then: >
                repo_count is 12, non_fork_count is 9, total_stars is 262418,
                languages is {"C": 8, "OpenSCAD": 1}
        - name: Collect Profiles
          description: >
            async collect_profiles(logins, fetch_json, concurrency=10) fetches
            profile and repos for every login through the injected fetcher and
            returns parsed pairs in input order.
          behavior: >
            For each login it awaits fetch_json("/users/<login>") and
            fetch_json("/users/<login>/repos?per_page=100"), builds
            {"profile": Expert Profile, "stats": Repo Stats}, and returns the
            list in the order of the input logins. At most `concurrency`
            logins are in flight at once (asyncio.Semaphore). If fetch_json
            raises for a login, that entry is None and the others are
            unaffected. The module itself opens no sockets: fetch_json is the
            only door to the network.
          requirements: [Stdlib Only, Offline Tests]
          guardrails: [No Network In Core]
          steps:
            - calls: Parse Profile Data
            - produces: Expert Pair
          examples:
            - given: >
                the 5 logins of tests/fixtures/search_users_python.json items
                (karpathy, openai, google, huggingface, rafaballerini) and a
                fake async fetch_json that returns the parsed
                user_torvalds.json for any /users/<login> and the parsed
                repos_torvalds.json for any /users/<login>/repos
              when: collect_profiles(logins, fetch_json, concurrency=2) is awaited
              then: >
                the result has 5 entries in input order, each with profile
                login "torvalds" and stats total_stars 262418, and the fake
                was called exactly 10 times
            - given: the same 5 logins and a fetcher that raises ValueError for "google" only
              when: collect_profiles is awaited
              then: entry 2 is None and the other 4 entries are parsed pairs
              ref: Tolerant Parser
            - given: >
                the 5 search logins and a fake async fetch_json that, for
                /users/<login>, returns a copy of user_torvalds.json with login
                set to that login and followers set to its index 0..4 (repos:
                repos_torvalds.json), awaiting asyncio.sleep(0.01 * (5 - index))
                first so that later logins finish earlier
              when: collect_profiles(logins, fetch_json, concurrency=5) and concurrency=2 are awaited
              then: >
                profile logins and stats logins equal the input logins and
                followers are [0, 1, 2, 3, 4] in both runs; the test is red on
                a collectors.py that returns results in completion order or
                reversed
            - given: >
                the 5 search logins and a fake async fetch_json serving copies
                of user_torvalds.json / repos_torvalds.json that counts calls in
                flight (increment, record the peak, asyncio.sleep(0.01), decrement)
              when: collect_profiles(logins, fetch_json, concurrency=2) and concurrency=1 are awaited
              then: >
                the peak equals 2 and 1 respectively, 5 non-None results each;
                the test is red on a collectors.py without the semaphore (v3)
    - name: github_client
      description: The only module that talks to the network (v2).
      functions:
        - name: GitHub Client
          description: >
            GitHubClient(token=None, transport=None, sleep=None, clock=None,
            max_pages=10).fetch_json(path) is the live fetch_json for
            collect_profiles: token from GITHUB_TOKEN, rate-limit waits via
            seconds_to_wait, list responses followed across Link rel="next".
          behavior: >
            See docs/TASK_MEGATRON_V2.md section 2.3 for the exact behaviour,
            headers and the Transport contract
            transport(url, headers) -> (status, headers, body_bytes); the
            default transport is urllib_transport (urllib.request).
          requirements: [Stdlib Only, Offline Tests, Real Fixtures]
          guardrails: [No Network In Core]
          steps:
            - calls: Parse Rate Limit
            - reads: GitHub Repos JSON
            - produces: GitHub Repos JSON
          examples:
            - given: tests/fixtures/repos_torvalds_page{1,2,3}.json with their .headers.txt
              when: fetch_json("/users/torvalds/repos?per_page=5") over a fake transport
              then: 12 items from 3 requests; parse_repo_stats total_stars 262425
            - given: rate_limit_headers.txt with x-ratelimit-remaining "0", clock 1790594766
              when: fetch_json is awaited twice
              then: the second call sleeps exactly 120 seconds before its request
            - given: a fake transport answering /users/torvalds with status 400
              when: fetch_json("/users/torvalds") is awaited
              then: GitHubError with .status 400 after one request (the boundary, v3)
    - name: cli
      description: python -m megatron harvest <login>... (v2).
      functions:
        - name: Harvest
          description: >
            harvest(logins, fetch_json, db_path, concurrency=10) runs
            collect_profiles -> score_expertise -> save_experts and returns
            {"requested", "saved", "failed"}; main(argv=None, fetch_json=None)
            is the CLI, building GitHubClient() when no fetcher is given.
          requirements: [Stdlib Only, Offline Tests]
          steps:
            - calls: Collect Profiles
            - calls: Score Expertise
            - calls: Store Experts
          examples:
            - given: fake fetch_json for torvalds and minnow (copy of user_torvalds.json, login minnow, followers 7, repos [])
              when: harvest(["torvalds", "minnow"], fake, db) is awaited
              then: saved 2, top_experts scores [850302, 7]
            - given: a real GitHubClient over a fake transport serving the 3 repos pages
              when: main(["harvest", "torvalds", "--db", db], fetch_json=client.fetch_json)
              then: exit 0, total_stars 262425, expertise_score 850316
            - given: urllib_transport patched to serve search_page1/2 with their headers (v4)
              when: main(["discover", "followers:>5000", "--pages", "2"])
              then: exit 0, stdout = the 60 logins of pages 1 and 2 in API order, one per line
    - name: search
      description: GitHub user search -> logins, paged along Link rel="next" (v4).
      functions:
        - name: Discover Logins
          description: >
            discover_logins(client, query, pages, per_page=30) fetches
            search_url(query) and then each rel="next" URL verbatim through
            client.fetch_json, parsing every page with parse_search_page into
            {"logins", "total_count", "incomplete_results", "pages"}.
          behavior: >
            See docs/TASK_MEGATRON_V4.md section 2.3. Search has its own
            rate-limit resource (x-ratelimit-resource search, 10/min anonymous);
            the client's single rate-limit state applies to every page.
          requirements: [Stdlib Only, Offline Tests, Real Fixtures]
          guardrails: [No Network In Core]
          steps:
            - calls: GitHub Client
            - reads: GitHub Search JSON
          examples:
            - given: tests/fixtures/search_page{1,2}.json with their .headers.txt
              when: discover_logins(client, "followers:>5000", 2)
              then: 60 logins, page 1's 30 then page 2's 30; total_count 1230; 2 requests
            - given: search_empty.json (no link header)
              when: discover_logins(client, "followers:>100000000", 3)
              then: logins [], total_count 0, pages 1, one request
            - given: page 1 headers with x-ratelimit-remaining "0", clock 1790599575
              when: discover_logins(client, "followers:>5000", 2)
              then: exactly one sleep of 60 seconds before the page-2 request
    - name: processors
      description: Expertise scoring over parsed profile data.
      functions:
        - name: Score Expertise
          description: >
            score_expertise(profile, stats) merges an Expert Profile and its
            Repo Stats into an Expert Record with expertise_score and
            primary_language.
          behavior: >
            expertise_score = followers + 2 * total_stars (integers).
            primary_language is the language with the highest count in
            stats["languages"] (ties broken by lexicographic order), or None
            when languages is empty. The record carries the Expert Profile
            keys plus total_stars, languages, expertise_score,
            primary_language. No second serialization of the profile.
          requirements: [Stdlib Only]
          steps:
            - reads: Expert Profile
            - reads: Repo Stats
            - produces: Expert Record
          examples:
            - given: >
                the torvalds profile (followers 325466) and stats
                (total_stars 262418, languages {"C": 8, "OpenSCAD": 1})
              when: score_expertise is called
              then: expertise_score is 850302 and primary_language is "C"
            - given: 'stats with languages {} and total_stars 0, profile with followers 7'
              when: score_expertise is called
              then: expertise_score is 7 and primary_language is None
    - name: storage
      description: SQLite persistence and ranking of expert records.
      functions:
        - name: Store Experts
          description: >
            save_experts(db_path, records) upserts Expert Records into the
            experts table keyed by login; top_experts(db_path, n=10) returns
            the n records with the highest expertise_score.
          behavior: >
            save_experts creates the schema if absent (CREATE TABLE IF NOT
            EXISTS experts, login TEXT PRIMARY KEY), upserts by login
            (INSERT ... ON CONFLICT(login) DO UPDATE), stores languages as a
            JSON string, and returns the number of records written.
            top_experts returns Expert Records ordered by expertise_score
            DESC, languages decoded back to a dict.
          requirements: [Stdlib Only]
          guardrails: [No Network In Core]
          steps:
            - reads: Expert Record
            - modifies: Experts Database
          examples:
            - given: the torvalds Expert Record (expertise_score 850302) saved twice into a fresh temp db
              when: the experts table is counted
              then: there is exactly 1 row
            - given: 'that db plus a second record login "minnow" with expertise_score 100'
              when: top_experts(db_path, 1) is called
              then: >
                the result is one record, login "torvalds", expertise_score
                850302, languages equal to {"C": 8, "OpenSCAD": 1}
            - given: >
                the torvalds record built from the fixtures (followers 325466,
                total_stars 262418, expertise_score 850302), then the live row
                of the 2026-09-28 smoke (325474, 262428, 850330) for the same login
              when: both are saved in turn into a fresh temp db
              then: >
                exactly 1 row, and top_experts returns the second record whole;
                red on INSERT OR IGNORE and on ON CONFLICT DO NOTHING (v3)
      dataObjects:
        - name: Experts Database
          description: A SQLite file with one table, experts, keyed by login.
          schema: >
            experts(login TEXT PRIMARY KEY, id INTEGER, name TEXT,
            company TEXT, location TEXT, followers INTEGER,
            public_repos INTEGER, created_at TEXT, total_stars INTEGER,
            languages TEXT, expertise_score INTEGER, primary_language TEXT)
  dataObjects:
    - name: Rate Limit State
      description: Parsed GitHub rate-limit headers.
      schema:
        limit: int
        remaining: int
        reset: int (unix seconds)
    - name: GitHub User JSON
      description: >
        A verbatim GitHub REST /users/<login> response; the real sample is
        tests/fixtures/user_torvalds.json (fetched 2026-09-28).
      schema: see tests/fixtures/user_torvalds.json
    - name: GitHub Repos JSON
      description: >
        A verbatim GitHub REST /users/<login>/repos response list; the real
        sample is tests/fixtures/repos_torvalds.json (12 items).
      schema: see tests/fixtures/repos_torvalds.json
    - name: Expert Profile
      description: The parsed subset of a GitHub user this system keeps.
      schema:
        login: str
        id: int
        name: str or None
        company: str or None
        location: str or None
        followers: int
        public_repos: int
        created_at: str or None
    - name: Repo Stats
      description: Aggregates over one user's repos; forks excluded from stats.
      schema:
        login: str
        repo_count: int
        non_fork_count: int
        total_stars: int
        languages: dict language -> non-fork repo count
    - name: GitHub Search JSON
      description: >
        Verbatim /search/users body: total_count, incomplete_results, items[*].login
        (tests/fixtures/search_page1.json, search_page2.json, search_empty.json).
      schema: see tests/fixtures/search_page1.json
    - name: Expert Pair
      description: One collector result.
      schema:
        profile: Expert Profile
        stats: Repo Stats
    - name: Expert Record
      description: Expert Profile keys plus scoring fields; see Score Expertise.
      schema:
        "...Expert Profile keys": ""
        total_stars: int
        languages: dict
        expertise_score: int
        primary_language: str or None
Requirement:
  - name: Stdlib Only
    description: >
      Python 3.9-compatible syntax, standard library only (json, asyncio,
      sqlite3, unittest). No third-party runtime dependency in v1.
  - name: Offline Tests
    description: >
      No test opens a network connection. All GitHub data in tests comes from
      tests/fixtures/*, which are verbatim API responses.
  - name: Real Fixtures
    description: >
      Every number in the examples is read from tests/fixtures/* fetched from
      api.github.com on 2026-09-28, not invented.
Guardrail:
  - name: Tolerant Parser
    description: >
      Missing optional fields and a failing single login degrade to
      None/0/skip, never to an exception that kills the batch.
  - name: No Network In Core
    description: >
      Only megatron/github_client.py may import a network library, and only
      urllib (v2). Every other module under megatron/ imports no urllib,
      http, requests or socket; collect_profiles takes the fetcher injected.
